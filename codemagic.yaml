definitions:
  flutter_version: &flutter_version
    flutter: 3.44.4

  resolve_dependencies: &resolve_dependencies
    name: Resolve Dart dependencies from the lockfile
    script: |
      set -e
      flutter --version
      flutter pub get --enforce-lockfile

  static_analysis: &static_analysis
    name: Static analysis
    script: |
      set -e
      flutter analyze

workflows:
  android-release:
    name: Android Release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *flutter_version
      java: 17
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - *resolve_dependencies
      - *static_analysis
      - name: Build Android App Bundle
        script: |
          set -e
          flutter build appbundle \
            --release \
            --build-number="$PROJECT_BUILD_NUMBER"
      - name: Build universal APK
        script: |
          set -e
          flutter build apk \
            --release \
            --build-number="$PROJECT_BUILD_NUMBER"
      - name: Verify Android artifacts
        script: |
          set -e
          AAB="$CM_BUILD_DIR/build/app/outputs/bundle/release/app-release.aab"
          APK="$CM_BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk"
          for artifact in "$AAB" "$APK"; do
            if [ ! -s "$artifact" ]; then
              echo "Expected artifact is missing or empty: $artifact"
              exit 1
            fi
            echo "$(basename "$artifact") $(du -h "$artifact" | cut -f1)"
          done
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/release/mapping.txt

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      <<: *flutter_version
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - *resolve_dependencies
      - *static_analysis
      - name: Generate the iOS build configuration
        script: |
          set -e
          flutter build ios --config-only --release
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update
      - name: Build unsigned iOS application bundle
        script: |
          set -e
          flutter build ios \
            --release \
            --no-codesign \
            --build-number="$PROJECT_BUILD_NUMBER"
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/build/ios/iphoneos" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No application bundle was produced in build/ios/iphoneos."
            exit 1
          fi
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -qry "$(basename "$APP_PATH" .app).ipa" Payload
          rm -rf Payload
      - name: Verify iOS artifact
        script: |
          set -e
          IPA=$(find "$CM_BUILD_DIR/build/ios/ipa" -name '*.ipa' | head -1)
          if [ ! -s "$IPA" ]; then
            echo "No IPA was produced."
            exit 1
          fi
          unzip -l "$IPA" | grep -q "Payload/.*\.app/Info.plist" || {
            echo "The IPA does not contain a Payload application bundle."
            exit 1
          }
          echo "$(basename "$IPA") $(du -h "$IPA" | cut -f1)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
