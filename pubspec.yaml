name: studentapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.3.0
  flutter_animate: ^4.5.2
  uuid: ^4.5.3
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  video_player: ^2.10.0
  wakelock_plus: ^1.3.2
  flutter_svg: ^2.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  onesignal_flutter: ^5.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.2
  flutter_launcher_icons: ^0.14.4

# Launcher-icon sources live in branding/ rather than assets/. They are build
# inputs consumed by flutter_launcher_icons, not runtime assets — keeping them
# under assets/ shipped ~1.8 MB of PNGs (and a Windows .ico) inside every
# install for no reason.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "branding/app_icon_bg.png"
  adaptive_icon_foreground: "branding/app_icon_adaptive_fg.png"
  remove_alpha_ios: true
  background_color_ios: "#F0F6FF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Readex Pro, declared as a first-class Flutter family rather than resolved
  # through google_fonts. The app is Arabic, so the font MUST carry the Arabic
  # block — these instances are cut from the upstream variable font (full 761
  # codepoint charset, wght axis pinned per weight), not from the Google Fonts
  # CSS endpoint, which serves Latin-subset files that silently render every
  # Arabic string in a fallback face.
  #
  # Declaring the family here means Flutter loads it from the bundle at startup:
  # no network, no async font swap, no system fallback. Readex Pro's axis stops
  # at 700, so w800/w900 text resolves to Bold.
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
